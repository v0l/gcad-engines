[package]
name = "gcad-native-tests"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "Tests that drive the native FBX helper through gcad's game-asset process boundary"

[workspace]

[dependencies]
gcad = { git = "https://github.com/v0l/gcad", rev = "df083cdf6585b3a462d1b673157b254ef2a631dc", default-features = false, features = ["game-assets"] }

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"

[features]
default = ["game-assets"]
game-assets = []

# Copied from gcad's Cargo.toml at GCAD_REV by scripts/bump-gcad.sh.
[patch.crates-io]
egui_bench = { git = "https://github.com/v0l/egui_bench", rev = "e37138d6c698c1fd6de2284acf23f669b27ab0a9" }
