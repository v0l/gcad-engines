[package]
name = "gcad-bevy"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Load gcad .gcad and .gasm files as Bevy scenes: meshes, materials, skins, clips, morph targets and LODs"
repository = "https://github.com/v0l/gcad-engines"
publish = false

[workspace]

[features]
default = ["multi_threaded"]
multi_threaded = ["bevy/multi_threaded"]
brep = ["gcad2glb/brep"]
parallel = ["gcad2glb/parallel"]
hot-reload = ["bevy/file_watcher"]
window = ["bevy/3d", "bevy/x11", "bevy/wayland", "bevy/tonemapping_luts"]

[dependencies]
gcad2glb = { git = "https://github.com/v0l/gcad", rev = "434c02e72c9d4cbcb5331479733bf7a2f7611f82", default-features = false }
serde = { version = "1", features = ["derive"] }
bitcode = "0.6"
bevy = { version = "0.20", default-features = false, features = [
  "std",
  "bevy_asset",
  "bevy_log",
  "bevy_pbr",
  "bevy_image",
  "png",
  "bevy_animation",
  "bevy_world_serialization",
  "bevy_curve",
  "morph",
  "morph_animation",
] }

[dev-dependencies]
bevy = { version = "0.20", default-features = false, features = ["debug"] }

[[example]]
name = "hero"
required-features = ["window"]

[[example]]
name = "props"
required-features = ["window", "brep"]

